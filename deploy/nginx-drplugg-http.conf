# DrPlugg – HTTP-only serverblock (används av install.sh FÖRE certifikatet finns)
# Skrivs till /etc/nginx/sites-available/drplugg, symlinkas till sites-enabled.
# Innehåller ingen TLS-referens → "nginx -t" går igenom även innan certbot körts.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Låt certbot (webroot) lägga sin utmaning här
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;

        # Skyddsnät (defense in depth): intern adress i en Location-header skrivs
        # om till den publika värden. Appen bygger redan korrekta omdirigeringar.
        proxy_redirect https://localhost:__PORT__/ https://$host/;
        proxy_redirect http://localhost:__PORT__/  http://$host/;

        proxy_set_header Host              $host;
        # Skydd mot CVE-2025-29927: klienten får aldrig skicka med denna header
        proxy_set_header x-middleware-subrequest "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Krävs av appen för att kunna bygga publika URL:er (PUBLIC_URL är förstahandsval)
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        # Samma enkla mönster som övriga sajter på servern (ingen map behövs)
        proxy_set_header Connection        "upgrade";

        # Karolinas svar streamas (SSE) – buffring måste vara av
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
